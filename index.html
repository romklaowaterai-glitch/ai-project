        <!-- ส่วนแสดงผลกล้องและข้อมูล -->
        <div class="grid">
            <div class="card" style="text-align: center;">
                <h3>กล้องตรวจจับสีน้ำ</h3>
                <div id="webcam-container"></div>
                <div id="label-container" class="data-value" style="margin-top: 15px; font-size: 20px;">---</div>
            </div>
            
            <div class="card">
                <h3>ค่าจากเซนเซอร์ตรวจสอบคุณภาพน้ำ</h3>
                <div class="sensor-item">ความเป็นกรด-ด่าง (pH): <span id="ph-val" class="data-value" style="float: right;">-</span></div>
                <div class="sensor-item">ความขุ่น (Turbidity): <span id="turb-val" class="data-value" style="float: right;">- NTU</span></div>
                <div class="sensor-item">อุณหภูมิ (Temperature): <span id="temp-val" class="data-value" style="float: right;">- °C</span></div>
            </div>
        </div>

        <!-- กล่องแจ้งเตือนภัยบนหน้าจอ -->
        <div id="alert-box" style="display: none; margin-top: 20px; padding: 15px; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 8px; font-weight: bold; text-align: center;">
            ⚠️ คำเตือน: ตรวจพบคุณภาพน้ำผิดปกติ!
        </div>
    </div>

    <!-- ลิงก์ Library สำหรับ TensorFlow.js และ Teachable Machine Image -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <script type="text/javascript">
        // 1. เปลี่ยน URL นี้เป็นโมเดล Teachable Machine ของคุณ
        const URL = "https://withgoogle.com";
        
        // 2. หากต้องการส่งเข้า LINE Notify ให้ใส่ Token ของคุณที่นี่ (ใช้งานผ่าน Backend Server จะปลอดภัยที่สุด)
        const LINE_NOTIFY_TOKEN = "YOUR_LINE_NOTIFY_TOKEN"; 

        let model, webcam, labelContainer, maxPredictions;
        let sensorInterval;
        let lastAlertTime = 0; // ป้องกันการส่งแจ้งเตือนรัวเกินไป

        // ฟังก์ชันเริ่มต้นระบบ AI และเปิดกล้อง
        async function initTM() {
            document.getElementById("sys-status").innerText = "กำลังโหลดโมเดล AI...";
            document.getElementById("sys-status").style.color = "#f39c12";

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            try {
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                const flip = true; 
                webcam = new tmImage.Webcam(300, 300, flip);
                await webcam.setup(); 
                await webcam.play();
                window.requestAnimationFrame(loop);

                document.getElementById("webcam-container").innerHTML = "";
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                
                labelContainer = document.getElementById("label-container");
                document.getElementById("sys-status").innerText = "ระบบกำลังทำงานเรียลไทม์";
                document.getElementById("sys-status").style.color = "#2ecc71";

                // เริ่มอ่านค่าเซนเซอร์จำลอง
                startSensorReading();

            } catch (error) {
                console.error(error);
                alert("ไม่สามารถเปิดกล้องหรือโหลดโมเดลได้ โปรดตรวจสอบสิทธิ์การใช้กล้อง");
                document.getElementById("sys-status").innerText = "เกิดข้อผิดพลาด";
                document.getElementById("sys-status").style.color = "#e74c3c";
            }
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        // ตัวแปรเก็บสถานะล่าสุดเพื่อนำไปคำนวณและแจ้งเตือน
        let currentWaterColor = "";
        let currentpH = 7.0;
        let currentTurbidity = 0;

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            let highestPred = { className: "ไม่สามารถระบุได้", probability: 0 };
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestPred.probability) {
                    highestPred = prediction[i];
                }
            }
            
            currentWaterColor = highestPred.className;
            labelContainer.innerText = `${currentWaterColor} (${(highestPred.probability * 100).toFixed(0)}%)`;
            
            // ตรวจสอบเงื่อนไขความผิดปกติ
            checkWaterQuality();
        }

        function startSensorReading() {
            if (sensorInterval) clearInterval(sensorInterval);
            
            sensorInterval = setInterval(() => {
                // จำลองสุ่มค่าเซนเซอร์ (สามารถเขียนดึงค่าจาก Hardware จริงผ่าน API ได้ตรงนี้)
                currentpH = (6.0 + Math.random() * 3).toFixed(2); // สุ่มช่วง 6.0 - 9.0
                currentTurbidity = (2 + Math.random() * 28).toFixed(1); // สุ่มช่วง 2 - 30 NTU
                const temp = (27 + Math.random() * 4).toFixed(1);

                document.getElementById("ph-val").innerText = currentpH;
                document.getElementById("turb-val").innerText = currentTurbidity + " NTU";
                document.getElementById("temp-val").innerText = temp + " °C";

                checkWaterQuality();
            }, 3000); // อัปเดตทุก 3 วินาที
        }

        // ฟังก์ชันตรวจสอบและแจ้งเตือนระบบ
        function checkWaterQuality() {
            let isDangerous = false;
            let alertMessage = "⚠️ คำเตือน: ";

            // เงื่อนไขที่ 1: สีน้ำวิกฤต (อิงตามชื่อ Class ที่ตั้งไว้ใน Teachable Machine)
            if (currentWaterColor.includes("น้ำเสีย") || currentWaterColor.includes("น้ำเน่า") || currentWaterColor.includes("Toxic")) {
                isDangerous = true;
                alertMessage += `ตรวจพบสีน้ำอันตราย (${currentWaterColor}) `;
            }

            // เงื่อนไขที่ 2: ค่า pH ผิดปกติ
            if (currentpH < 6.5 || currentpH > 8.5) {
                isDangerous = true;
                alertMessage += `ค่า pH ผิดปกติ (${currentpH}) `;
            }

            // เงื่อนไขที่ 3: ค่าความขุ่นเกินเกณฑ์
            if (currentTurbidity > 20.0) {
                isDangerous = true;
                alertMessage += `น้ำมีความขุ่นสูง (${currentTurbidity} NTU) `;
            }

            const alertBox = document.getElementById("alert-box");
            if (isDangerous) {
                alertBox.innerText = alertMessage;
                alertBox.style.display = "block";
                
                // ส่งการแจ้งเตือนภายนอก (เช่น LINE) โดยจำกัดให้ส่งห่างกันอย่างน้อย 5 นาที (300,000 มิลลิวินาที)
                let now = Date.now();
                if (now - lastAlertTime > 300000) {
                    sendLineNotification(alertMessage);
                    lastAlertTime = now;
                }
            } else {
                alertBox.style.display = "none";
            }
        }

        // ฟังก์ชันส่งข้อมูลไปยัง LINE Notify (โครงสร้างพื้นฐาน)
        function sendLineNotification(message) {
            console.log("ส่งแจ้งเตือนไปยัง LINE:", message);
            
            // หมายเหตุ: การเรียกใช้ LINE Notify API จากฝั่ง Client (Browser) โดยตรง มักจะติดปัญหา CORS 
            // ในขั้นตอนใช้งานจริง แนะนำให้ส่งข้อมูลนี้ไปยังหลังบ้าน (Node.js/Python Server) เพื่อให้ฝั่ง Server ส่งต่อให้ LINE ครับ
            /*
            fetch("https://line.me", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    "Authorization": "Bearer " + LINE_NOTIFY_TOKEN
                },
                body: new URLSearchParams({ message: message })
            }).then(res => console.log("Line Sent")).catch(err => console.error(err));
            */
        }
    </script>
</body>
</html>
