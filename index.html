<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบคุณภาพน้ำเรียลไทม์</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6; text-align: left; }
        #webcam-container { width: 100%; max-width: 400px; height: 300px; background: #ddd; margin: 0 auto; border-radius: 8px; overflow: hidden; }
        .status-ok { color: green; font-weight: bold; }
        .data-value { font-size: 24px; font-weight: bold; color: #333; margin-top: 5px; }
        button { background: #1a73e8; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; }
        button:hover { background: #1557b5; }
    </style>
                 <!-- เรียกใช้งาน TensorFlow.js และ Teachable Machine สำหรับกล้องเว็บแคม -->
    <script src="https://jsdelivr.net" defer></script>
    <script src="https://jsdelivr.net" defer></script>
</head>
<body>

    <div class="container">
        <h1>ระบบรวบรวมข้อมูลคุณภาพน้ำและสีน้ำเรียลไทม์</h1>
        <p>สถานะระบบ: <span id="sys-status" class="status-ok">พร้อมทำงาน</span></p>

        <button type="button" onclick="initTM()">1. เปิดกล้องเว็บแคมและเริ่มระบบ AI</button>

        <div class="grid">
            <!-- ฝั่งเว็บแคมและผลลัพธ์ AI -->
            <div class="card">
                <h3>📷 วิเคราะห์สีของน้ำ (Webcam AI)</h3>
                <div id="webcam-container"></div>
                <p>ผลลัพธ์สีน้ำ: <span id="water-color-res" class="data-value">-</span></p>
                <p>ความแม่นยำ: <span id="accuracy-res" class="data-value">-</span></p>
            </div>

            <!-- ฝั่งเซนเซอร์ ESP32 -->
            <div class="card">
                <h3>🔌 ค่าจากเซนเซอร์ (ESP32)</h3>
                <p>🌡️ อุณหภูมิ: <span id="esp-temp">-</span> °C</p>
                <p>🧪 ค่า pH: <span id="esp-ph">-</span></p>
                <p>☁️ ความขุ่น: <span id="esp-turbidity">-</span></p>
                <p>💧 ค่า TDS: <span id="esp-tds">-</span> ppm</p>
            </div>
        </div>
    </div>

<script>
    // ⚠️ ลิงก์โมเดลจำลองของ Teachable Machine (ถ้ามีลิงก์ส่วนตัวของคุณ สามารถนำมาเปลี่ยนตรงนี้ได้ครับ)
    const URL_MODEL = "https://withgoogle.com"; 
    let model, webcam, maxPredictions;

    async function initTM() {
        const statusSpan = document.getElementById("sys-status");
        statusSpan.innerText = "กำลังโหลดโมเดล AI...";
        
        try {
            const modelURL = URL_MODEL + "model.json";
            const metadataURL = URL_MODEL + "metadata.json";

            // โหลดโมเดล
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // ตั้งค่าและเปิดเว็บแคม
            const flip = true; 
            webcam = new tmImage.Webcam(300, 300, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            // แสดงผลกล้องบนหน้าเว็บ
            document.getElementById("webcam-container").innerHTML = "";
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            statusSpan.innerText = "ระบบ AI กำลังทำงาน";
        } catch (error) {
            console.error(error);
            statusSpan.innerText = "โหลดโมเดลหรือกล้องล้มเหลว";
        }
    }

    async function loop() {
        webcam.update(); 
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        
        // หา Class ที่มีความแม่นยำสูงสุด
        let highestPred = { className: "-", probability: 0 };
        for (let i = 0; i < maxPredictions; i++) {
            if (prediction[i].probability > highestPred.probability) {
                highestPred = prediction[i];
            }
        }
        
        // แสดงผลลัพธ์สีน้ำและความแม่นยำบนหน้าจอ
        document.getElementById("water-color-res").innerText = highestPred.className;
        document.getElementById("accuracy-res").innerText = (highestPred.probability * 100).toFixed(2) + "%";
    }

    // --- ฟังก์ชันรับข้อมูลจาก ESP32 (คงเดิมไว้) ---
    // (ส่วนนี้จะรอรับค่า WebSocket จากเซนเซอร์ของคุณเมื่อเชื่อมต่อจริงในแล็บ)
    window.addEventListener("message", function(event) {
        if (event.data.type === "ESP32_DATA") {
            const espData = event.data;
            document.getElementById("esp-temp").innerText = espData.temp;
            document.getElementById("esp-ph").innerText = espData.ph;
            document.getElementById("esp-turbidity").innerText = espData.turbidity;
            document.getElementById("esp-tds").innerText = espData.tds;
        }
    });
</script>
</body>
</html>
